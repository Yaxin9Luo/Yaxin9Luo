name: Update README

on:
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-research-impact.yml"
      - "data/research-repos.json"
      - "scripts/update_readme.py"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Exits non-zero and leaves README.md untouched on any error, so nothing is committed.
      - name: Render stars and publications
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md data/research-repos.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/research-repos.json
          git commit -m "Update README stars and publications"
          git push
